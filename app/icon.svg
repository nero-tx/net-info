<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#040816" stroke="url(#bgGrad)" stroke-width="2.5" />

  <!-- Center subtle ambient glow -->
  <circle cx="32" cy="32" r="16" fill="#06b6d4" opacity="0.15" />

  <!-- Activity pulse wave -->
  <path
    d="M12 32 H21 L26 44 L38 20 L43 32 H52"
    stroke="url(#pulseGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Pulse dots -->
  <circle cx="26" cy="44" r="2.2" fill="#22d3ee" />
  <circle cx="38" cy="20" r="2.2" fill="#60a5fa" />
</svg>
